name: Build executables

# Two ways to run (see docs/RELEASING.md):
#   - by hand: Actions › "Build executables" › Run workflow, tick the
#     platforms, and tick Publish to put the files on a GitHub Release;
#   - by pushing a tag: `git tag v0.9.4 && git push origin v0.9.4` builds every
#     platform and publishes release v0.9.4.
# Each platform is built by build-platform.yml; publishing is
# publish-release.yml. A platform that fails doesn't stop the others from
# being published: the run warns and says how to add it later.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos-arm64:
        description: "macOS, Apple Silicon"
        type: boolean
        default: true
      macos-amd64:
        description: "macOS, Intel"
        type: boolean
        default: true
      windows-amd64:
        description: "Windows 64-bit"
        type: boolean
        default: true
      windows-386:
        description: "Windows 32-bit"
        type: boolean
        default: true
      linux-amd64:
        description: "Linux 64-bit"
        type: boolean
        default: true
      version:
        description: "Version (empty = productVersion from wails.json). A suffix like 0.9.4-beta.1 makes a pre-release."
        required: false
        default: ""
      publish:
        description: "Publish the files to a GitHub Release (created if missing; same-name files replaced, others kept)"
        type: boolean
        default: false
      tag:
        description: "Release tag (empty = v<version>)"
        required: false
        default: ""
      draft:
        description: "Keep the release as a draft (not visible to the public until you publish it)"
        type: boolean
        default: false
      mac_runner:
        description: "Where macOS builds run: GitHub's macOS runners, or your own Mac registered as a self-hosted runner"
        type: choice
        default: github
        options:
          - github
          - self-hosted

permissions:
  contents: read

jobs:
  # Works out the version, the release tag and the platforms to build.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      names: ${{ steps.select.outputs.names }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: wails.json
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          app=$(jq -r .info.productVersion wails.json)
          if [ "$EVENT" = "push" ]; then
            TAG="$REF"
            VERSION="${REF#v}"
            PUBLISH=true
            if [ "$VERSION" != "$app" ]; then
              echo "::warning::Tag $REF doesn't match wails.json productVersion $app; the build uses $VERSION."
            fi
          fi
          [ -n "$VERSION" ] || VERSION="$app"
          [ -n "$TAG" ] || TAG="v$VERSION"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, tag $TAG, publish: $PUBLISH"

      - id: select
        env:
          EVENT: ${{ github.event_name }}
          INPUTS: ${{ toJSON(inputs) }}
          # A runner label list: GitHub's macOS image, or any of your own Macs
          # registered as a self-hosted runner (labels "self-hosted" + "macOS").
          MAC_RUNNER: ${{ inputs.mac_runner == 'self-hosted' && '["self-hosted","macOS"]' || '"macos-latest"' }}
          # Ubuntu 24.04 ships WebKitGTK 4.1 only (same tag as the Dockerfile).
          ALL: |
            [
              {"name": "macos-arm64",   "runner": "MAC",            "platform": "darwin/arm64"},
              {"name": "macos-amd64",   "runner": "MAC",            "platform": "darwin/amd64"},
              {"name": "windows-amd64", "runner": "windows-latest", "platform": "windows/amd64"},
              {"name": "windows-386",   "runner": "windows-latest", "platform": "windows/386"},
              {"name": "linux-amd64",   "runner": "ubuntu-24.04",   "platform": "linux/amd64", "tags": "webkit2_41"}
            ]
        run: |
          matrix=$(jq -c --arg event "$EVENT" --argjson inputs "$INPUTS" --argjson mac "$MAC_RUNNER" '
            {include: [.[]
              | select($event == "push" or $inputs[.name] == true)
              | .runner = (if .runner == "MAC" then $mac else .runner end | tojson)]}' <<< "$ALL")
          if [ "$(jq '.include | length' <<< "$matrix")" = 0 ]; then
            echo "::error::No platform ticked."
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "names=$(jq -c '[.include[].name]' <<< "$matrix")" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  build:
    name: ${{ matrix.name }}
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    uses: ./.github/workflows/build-platform.yml
    with:
      name: ${{ matrix.name }}
      platform: ${{ matrix.platform }}
      runs-on: ${{ matrix.runner }}
      tags: ${{ matrix.tags || '' }}
      version: ${{ needs.targets.outputs.version }}
      platform_base_url: ${{ vars.PLATFORM_BASE_URL || 'https://mango3s.com' }}

  # Runs even when some platforms failed, and publishes the ones that built.
  publish:
    needs: [targets, build]
    if: ${{ !cancelled() && needs.targets.outputs.publish == 'true' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.targets.outputs.version }}
      tag: ${{ needs.targets.outputs.tag }}
      draft: ${{ inputs.draft == true }}
      expected: ${{ needs.targets.outputs.names }}
