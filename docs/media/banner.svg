<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Mango3S: the free desktop IDE for MongoDB">
  <!-- Animated README banner. Mango artwork from frontend/src/components/MangoBuddy.tsx.
       GitHub shows SVGs as images, so the animation is plain CSS and the fonts are system fonts. -->
  <style>
    .bob { animation: bob 2.4s ease-in-out infinite; }
    .shadow { animation: shadow 2.4s ease-in-out infinite; transform-origin: 60px 134px; }
    .eyes { animation: blink 4.8s infinite; transform-origin: 61px 75px; }
    .arm { animation: wave 4.8s ease-in-out infinite; transform-origin: 96px 90px; }
    .leaf { animation: leaf 2.4s ease-in-out infinite; transform-origin: 64px 13px; }
    .glow { animation: glow 2.4s ease-in-out infinite; transform-origin: 140px 130px; }
    .r { opacity: 0; animation: cycle 15s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; } .r5 { animation-delay: 12s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(0.8); opacity: 0.6; } }
    @keyframes blink { 0%, 90%, 96%, 100% { transform: scaleY(1); } 93% { transform: scaleY(0.1); } }
    @keyframes wave { 0%, 55%, 100% { transform: rotate(0); } 62%, 76% { transform: rotate(-28deg); } 69%, 83% { transform: rotate(4deg); } }
    @keyframes leaf { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
    @keyframes glow { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      3%, 17% { opacity: 1; transform: translateY(0); }
      20%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <radialGradient id="bg" cx="16%" cy="50%" r="70%">
      <stop offset="0" stop-color="#2b2117"/>
      <stop offset="1" stop-color="#17191d"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#f08c2a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f08c2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hb" cx="34%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffe36e"/><stop offset="0.42" stop-color="#ffb321"/>
      <stop offset="0.78" stop-color="#ff8a1f"/><stop offset="1" stop-color="#ef5a2b"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fdc8f"/><stop offset="1" stop-color="#2a9a57"/>
    </linearGradient>
  </defs>

  <rect width="880" height="240" rx="20" fill="url(#bg)"/>
  <circle class="glow" cx="140" cy="130" r="120" fill="url(#halo)"/>

  <!-- Mango -->
  <g transform="translate(68 28) scale(1.3)">
    <ellipse class="shadow" cx="60" cy="134" rx="28" ry="4" fill="rgba(0,0,0,0.45)"/>
    <g class="bob">
      <path d="M26 92 q-11 3 -13 13" stroke="#f08a24" stroke-width="6" stroke-linecap="round" fill="none"/>
      <g class="arm"><path d="M96 90 q12 -3 15 -15" stroke="#f08a24" stroke-width="6" stroke-linecap="round" fill="none"/></g>
      <ellipse cx="48" cy="127" rx="8" ry="4.5" fill="#d9701a"/>
      <ellipse cx="72" cy="127" rx="8" ry="4.5" fill="#d9701a"/>
      <path d="M62 24 C90 22 106 50 103 80 C100 110 82 128 60 128 C36 128 18 112 18 86 C18 56 34 26 62 24Z" fill="url(#hb)"/>
      <ellipse cx="41" cy="47" rx="10" ry="6" transform="rotate(-32 41 47)" fill="#fff" opacity="0.45"/>
      <path d="M61 26 q-1 -8 3 -13" stroke="#7a4a1f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <g class="leaf">
        <path d="M64 13 C72 1 91 1 97 9 C89 19 74 20 64 13Z" fill="url(#hl)"/>
        <path d="M67 13 C77 9 87 8 95 9" stroke="#1f7a43" stroke-width="1.2" fill="none" opacity="0.6"/>
      </g>
      <ellipse cx="37" cy="88" rx="5.5" ry="3.2" fill="#ff5d73" opacity="0.45"/>
      <ellipse cx="85" cy="88" rx="5.5" ry="3.2" fill="#ff5d73" opacity="0.45"/>
      <g class="eyes">
        <ellipse cx="47" cy="74" rx="7.5" ry="8.5" fill="#fff"/><circle cx="47" cy="75" r="4.4" fill="#3a2312"/><circle cx="48.6" cy="73.2" r="1.4" fill="#fff"/>
        <ellipse cx="75" cy="74" rx="7.5" ry="8.5" fill="#fff"/><circle cx="75" cy="75" r="4.4" fill="#3a2312"/><circle cx="76.6" cy="73.2" r="1.4" fill="#fff"/>
      </g>
      <path d="M52 87 q9 13 18 0 z" fill="#7a1f1f"/>
      <ellipse cx="61" cy="92.5" rx="4.2" ry="2.2" fill="#ff7a8a"/>
    </g>
  </g>

  <!-- Title -->
  <text x="300" y="104" font-size="64" font-weight="800" fill="#e4e7eb" letter-spacing="-1.5">Mango<tspan fill="#f08c2a">3S</tspan></text>
  <text x="302" y="140" font-size="21" fill="#a2abb7">The free desktop IDE for MongoDB · macOS, Windows, Linux</text>

  <!-- Rotating feature line -->
  <g class="mono" font-size="20">
    <text x="302" y="190" fill="#f08c2a">›</text>
    <g transform="translate(324 0)">
      <text class="r" y="190" fill="#e4e7eb">explore documents as a tree, a table or JSON</text>
      <text class="r r2" y="190" fill="#e4e7eb">build aggregations one stage at a time</text>
      <text class="r r3" y="190" fill="#e4e7eb">watch your server live: ops/s, lag, slow ops</text>
      <text class="r r4" y="190" fill="#e4e7eb">COLLSCAN → IXSCAN: find the slow part</text>
      <text class="r r5" y="190" fill="#e4e7eb">free. no account. no license key.</text>
    </g>
  </g>
</svg>
