<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Background of the macOS .dmg window. Icons sit on top of it at the
       positions in dmg-settings.py: Mango3S.app at (165, 180), Applications
       at (495, 180). Regenerate the .tiff with `make dmg-background`. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#2a2218"/>
      <stop offset="1" stop-color="#17191d"/>
    </radialGradient>
  </defs>
  <rect width="660" height="400" fill="url(#glow)"/>
  <g fill="none" stroke="#f08c2a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 180 C300 150 360 150 398 180" stroke-dasharray="2 12"/>
    <path d="M384 162 L400 181 L377 189"/>
  </g>
  <text x="330" y="300" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="20" font-weight="700" fill="#e4e7eb">Drag Mango3S into Applications</text>
  <text x="330" y="332" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" fill="#a2abb7">First launch: right-click Mango3S › Open</text>
</svg>
