# Development and test services for Mango3S.
#
#   docker compose up -d mongo                      # MongoDB with sample data on localhost:27017
#   docker compose --profile auth up -d mongo-auth  # MongoDB with authentication on localhost:27018
#   docker compose --profile test up --build --exit-code-from integration-tests
#   docker compose --profile sql up -d postgres mysql   # relational sources for migration tests
#   docker compose --profile rs up -d --wait mongo-rs   # single-node replica set on localhost:27020
#   docker compose --profile sharded up -d --wait       # sharded cluster: mongos on localhost:27021
#   docker compose --profile gui up --build app     # Linux + X11 only (experimental)
#   docker compose down -v                          # stop and delete data
name: mango3s

services:
  mongo:
    image: mongo:8.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo-auth:
    profiles: ["auth"]
    image: mongo:8.0
    ports:
      - "${MONGO_AUTH_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
    volumes:
      - mongo-auth-data:/data/db
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Relational sources for migration (P2). The read-only mango_reader users show
  # that a migration needs nothing beyond SELECT.
  postgres:
    profiles: ["sql"]
    image: postgres:17
    environment:
      POSTGRES_USER: mango
      POSTGRES_PASSWORD: mango
      POSTGRES_DB: shop
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - ./docker/sql-init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mango -d shop"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    profiles: ["sql"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: mango
      MYSQL_PASSWORD: mango
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - ./docker/sql-init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Single-node replica set (change streams, replication status). mongod listens
  # on 27020 inside the container too, so the member address the server
  # advertises (localhost:27020) works from the host:
  #   mongodb://localhost:27020/?replicaSet=rs0
  mongo-rs:
    profiles: ["rs"]
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27020"]
    ports:
      - "${MONGO_RS_PORT:-27020}:27020"
    volumes:
      - mongo-rs-data:/data/db
    healthcheck:
      # Initiates the set on first run, then reports healthy once it has a primary.
      test:
        - CMD
        - mongosh
        - --port
        - "27020"
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27020'}]}).ok }; db.hello().isWritablePrimary ? 1 : quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Sharded cluster: a config server, two single-node shards and a mongos on
  # 27021 (connect to the mongos only): mongodb://localhost:27021
  mongo-cfg:
    profiles: ["sharded"]
    image: mongo:8.0
    command: ["mongod", "--configsvr", "--replSet", "cfg", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'cfg', configsvr: true, members: [{_id: 0, host: 'mongo-cfg:27017'}]}).ok }; db.hello().isWritablePrimary ? 1 : quit(1)"]
      interval: 5s
      timeout: 10s
      retries: 30
  mongo-shard1:
    profiles: ["sharded"]
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'shard1', members: [{_id: 0, host: 'mongo-shard1:27017'}]}).ok }; db.hello().isWritablePrimary ? 1 : quit(1)"]
      interval: 5s
      timeout: 10s
      retries: 30
  mongo-shard2:
    profiles: ["sharded"]
    image: mongo:8.0
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'shard2', members: [{_id: 0, host: 'mongo-shard2:27017'}]}).ok }; db.hello().isWritablePrimary ? 1 : quit(1)"]
      interval: 5s
      timeout: 10s
      retries: 30
  mongo-mongos:
    profiles: ["sharded"]
    image: mongo:8.0
    command: ["mongos", "--configdb", "cfg/mongo-cfg:27017", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${MONGO_SHARDED_PORT:-27021}:27017"
    depends_on:
      mongo-cfg: { condition: service_healthy }
      mongo-shard1: { condition: service_healthy }
      mongo-shard2: { condition: service_healthy }
    healthcheck:
      # Adds both shards on first run; healthy once the cluster has two shards.
      test: ["CMD", "mongosh", "--quiet", "--eval", "const n = db.adminCommand({listShards: 1}).shards.length; if (n < 2) { sh.addShard('shard1/mongo-shard1:27017'); sh.addShard('shard2/mongo-shard2:27017') }; db.adminCommand({listShards: 1}).shards.length === 2 ? 1 : quit(1)"]
      interval: 5s
      timeout: 15s
      retries: 30
      start_period: 5s

  integration-tests:
    profiles: ["test"]
    build:
      context: .
      target: integration
    environment:
      MONGO_URI: mongodb://mongo:27017
      # Used only when the "sql" profile is up as well; the tests skip otherwise.
      PG_DSN: ${PG_DSN_IN_DOCKER:-}
      MYSQL_DSN: ${MYSQL_DSN_IN_DOCKER:-}
    depends_on:
      mongo:
        condition: service_healthy

  app:
    profiles: ["gui"]
    build:
      context: .
      target: runtime
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - app-config:/home/app/.config/Mango3S
    network_mode: host

volumes:
  mongo-data:
  mongo-auth-data:
  mongo-rs-data:
  app-config:
